# cleanup-pr-app.yaml - purge IntegrityAnalysis_PR_<n> when its pull
# request closes, merged or not (deploy trio, part 3).
#
# PROVENANCE: written by Claude Code (model Claude Fable 5), 2026-08-19.
# Automates the "purge test apps after merging" rule from AGENTS.md.
#
# FAIL LOUDLY (2026-08-20, Steve's direction): the original wrapped
# terminateApp/purgeApp in try() and reported success no matter what.
# Cleanup fires at merge time - exactly when deploy-production and the
# pages build are hitting the same shinyapps account - so transient
# 409 "task in progress" errors were routine, silently swallowed, and
# seven stale PR apps accumulated before anyone noticed. Same failure
# shape as the NCBI batch lookups: a swallowed error is
# indistinguishable from a real result. Now: up to 5 attempts with a
# 60-second pause (outlasting a typical deploy), and if the app still
# exists at the end the JOB FAILS, so the leftover shows up in the
# checks instead of on the shinyapps dashboard months later. A PR that
# never had an app still passes - "nothing to purge" is a real success.

name: cleanup-pr-app

on:
  pull_request:
    types: [closed]

permissions: read-all

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install rsconnect
        run: Rscript -e 'install.packages("rsconnect")'

      - name: Terminate and purge the PR app
        env:
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
          SHINY_ACCOUNT: ${{ vars.SHINY_ACCOUNT }}
          SHINY_APP_NAME: ${{ vars.SHINY_APP_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          Rscript -e '
            nm <- paste0(Sys.getenv("SHINY_APP_NAME"), "_PR_",
                         Sys.getenv("PR_NUMBER"))
            acct <- Sys.getenv("SHINY_ACCOUNT")
            rsconnect::setAccountInfo(
              name   = acct,
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET"))
            exists <- function() {
              apps <- rsconnect::applications(account = acct,
                                              server = "shinyapps.io")
              nm %in% apps$name
            }
            if (!exists()) {
              cat(nm, "does not exist - nothing to purge\n")
              quit(status = 0)
            }
            for (attempt in 1:10) {
              ok <- tryCatch({
                rsconnect::terminateApp(appName = nm, account = acct,
                                        server = "shinyapps.io")
                rsconnect::purgeApp(appName = nm, account = acct,
                                    server = "shinyapps.io")
                TRUE
              }, error = function(e) {
                cat("attempt", attempt, "failed:", conditionMessage(e), "\n")
                FALSE
              })
              if (ok || !exists()) break
              Sys.sleep(90)   # a PR app mid-deploy 409s until ITS OWN build finishes (~10 min)
            }
            if (exists()) {
              cat("FAILED:", nm, "still exists after 10 attempts\n")
              quit(status = 1)
            }
            cat(nm, "terminated and purged\n")'
