# R-CMD-check.yaml - automated checks on every PR and push to main
# (package-restructure plan, phase 5: "check-standard.yaml first").
#
# PROVENANCE: written by Claude Code (model Claude Fable 5), 2026-08-19,
# adapted from r-lib/actions' check-standard example. Runs the full
# R CMD check - which includes the 514-assertion testthat suite - on
# Ubuntu with the current R release. The suite needs no local data:
# every test builds its own synthetic spreadsheets and PDFs (the corpus
# and the Carlisle files are never committed), and the AI-fallback
# tests are offline by construction. pdftools needs poppler, which
# setup-r-dependencies installs from the DESCRIPTION's SystemRequirements
# metadata automatically on Ubuntu.
#
# The deploy trio (production deploy on push to main; PR-app lifecycle)
# is deliberately NOT here yet - it needs the SHINY_TOKEN / SHINY_SECRET
# repository secrets (see the plan).

name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # renv (2026-08-20): R and every RUNTIME package version come
      # from renv.lock - the same environment Steve develops in and
      # production deploys. Dev tooling (rcmdcheck, testthat) installs
      # fresh below: its versions cannot touch the Monte Carlo, and
      # pinning it transitively would drag hundreds of suggests into
      # the lockfile. Latest-CRAN breakage of the runtime graph is
      # discovered by cran-canary.yaml on a schedule, not here.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Security check (tools/securityCheck.R - see AGENTS.md "Security")
        run: Rscript tools/securityCheck.R

      - name: System libraries (ubuntu)
        # setup-r-dependencies used to install these automatically from
        # SystemRequirements via pak; setup-renv does not, and RSPM
        # binaries install fine but fail to LOAD without them (found:
        # pdftools "required" errors = libpoppler-cpp missing).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libpoppler-cpp-dev libcurl4-openssl-dev libssl-dev             libxml2-dev libfontconfig1-dev libfreetype6-dev             libharfbuzz-dev libfribidi-dev libpng-dev libjpeg-dev             libtiff5-dev libcairo2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Dev tooling (floating - not part of the runtime lockfile)
        run: Rscript -e 'install.packages(c("rcmdcheck", "testthat", "pkgload"))'

      - uses: r-lib/actions/check-r-package@v2
        env:
          # Suggests absent from the runtime lockfile (tesseract) must
          # not fail the check; the suite never exercises OCR in CI
          _R_CHECK_FORCE_SUGGESTS_: "false"
        with:
          args: 'c("--no-manual", "--as-cran")'
          # Fail on ERRORs (which include any test failure) but tolerate
          # the one known WARNING: run_app() attaches its packages with
          # library(), the deliberate stanpumpR pattern documented in
          # R/app_run.R ("qualifying every call with :: is phase 2+
          # work, if ever"). If that refactor ever lands, tighten this
          # to the default "warning".
          error-on: '"error"'
          upload-snapshots: true
