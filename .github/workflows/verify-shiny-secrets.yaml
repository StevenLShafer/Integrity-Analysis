# verify-shiny-secrets.yaml - TEMPORARY, manually-triggered check that
# the SHINY_TOKEN / SHINY_SECRET repository secrets authenticate against
# shinyapps.io from a GitHub runner. Read-only (lists applications,
# deploys nothing). Delete after the deploy trio lands - it exists only
# to prove the secrets before building those workflows.
name: verify-shiny-secrets
on: workflow_dispatch
permissions: read-all
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install rsconnect
        run: Rscript -e 'install.packages("rsconnect")'
      - name: Authenticate and list applications
        env:
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
          SHINY_ACCOUNT: ${{ vars.SHINY_ACCOUNT }}
          SHINY_APP_NAME: ${{ vars.SHINY_APP_NAME }}
        run: |
          Rscript -e '
            for (v in c("SHINY_TOKEN", "SHINY_SECRET", "SHINY_ACCOUNT",
                        "SHINY_APP_NAME"))
              if (!nzchar(Sys.getenv(v))) stop(v, " is not set")
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINY_ACCOUNT"),
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET"))
            apps <- rsconnect::applications(
              account = Sys.getenv("SHINY_ACCOUNT"),
              server = "shinyapps.io")
            cat("Authenticated; applications visible:", nrow(apps), "\n")
            stopifnot(Sys.getenv("SHINY_APP_NAME") %in% apps$name)
            cat("Found", Sys.getenv("SHINY_APP_NAME"),
                "- the secrets work.\n")'
