# deploy-production.yaml - redeploy the production app on every push to
# main (package-restructure plan, phase 5: the deploy trio, part 1).
#
# PROVENANCE: written by Claude Code (model Claude Fable 5), 2026-08-19,
# adapted from the stanpumpR deploy pattern and the manual recipe in
# AGENTS.md: install the package FROM GITHUB at the pushed commit (so
# rsconnect records a GitHub source the shinyapps.io builder can
# reproduce - a locally-installed copy will not deploy), then ship only
# the one-line app.R shim. Secrets SHINY_TOKEN / SHINY_SECRET were
# verified against shinyapps.io on 2026-08-19 (run 32201131057).

name: deploy-production

on:
  push:
    branches: [main]

permissions: read-all

# One production deploy at a time; a newer push waits rather than racing
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # SECURITY GATE (2026-08-20, Steve's requirement): nothing deploys
      # without passing the static tripwire - see tools/securityCheck.R
      # and AGENTS.md "Security". It needs Rscript, so it runs right
      # after setup-r and before anything heavier.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Security check (gate - deploy stops here on failure)
        run: Rscript tools/securityCheck.R

      # installs the package's Imports (needed to install the package
      # itself on the runner) plus the deploy tooling, cached
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsconnect, any::remotes

      - name: Install the pushed commit from GitHub and deploy
        env:
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
          SHINY_ACCOUNT: ${{ vars.SHINY_ACCOUNT }}
          SHINY_APP_NAME: ${{ vars.SHINY_APP_NAME }}
        run: |
          Rscript -e '
            # First deploys from a fresh runner manifest force shinyapps to
            # build a new package image, which can exceed rsconnect'"'"'s
            # default per-request timeout while the client polls the build
            options(rsconnect.http.timeout = 900)
            remotes::install_github("StevenLShafer/IntegrityAnalysis",
                                    ref = Sys.getenv("GITHUB_SHA"),
                                    upgrade = "never", force = TRUE)
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINY_ACCOUNT"),
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET"))
            rsconnect::deployApp(
              appDir = ".",
              appName = Sys.getenv("SHINY_APP_NAME"),
              appFiles = "app.R",
              account = Sys.getenv("SHINY_ACCOUNT"),
              server = "shinyapps.io",
              forceUpdate = TRUE, launch.browser = FALSE)
            cat("production deployed at", Sys.getenv("GITHUB_SHA"), "\n")'
