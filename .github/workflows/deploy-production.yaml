# deploy-production.yaml - redeploy the production app after the checks
# pass on main (package-restructure plan, phase 5: the deploy trio,
# part 1).
#
# GATING (2026-08-20, Steve's request): this workflow triggers on the
# COMPLETION of R-CMD-check for a main-branch commit, and the job runs
# only when that check SUCCEEDED - so "the 553-assertion suite passed
# before every deploy" is a mechanism, not a convention. Previously it
# triggered on push and ran in parallel with the tests; a direct push
# to main with failing tests would have deployed. workflow_dispatch
# remains for a manual redeploy of whatever main currently holds.
#
# PROVENANCE: written by Claude Code (model Claude Fable 5), 2026-08-19,
# adapted from the stanpumpR deploy pattern and the manual recipe in
# AGENTS.md: install the package FROM GITHUB at the pushed commit (so
# rsconnect records a GitHub source the shinyapps.io builder can
# reproduce - a locally-installed copy will not deploy), then ship only
# the one-line app.R shim. Secrets SHINY_TOKEN / SHINY_SECRET were
# verified against shinyapps.io on 2026-08-19 (run 32201131057).

name: deploy-production

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: read-all

# One production deploy at a time; a newer push waits rather than racing
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; deploy only on success (a
    # manual dispatch carries no workflow_run payload and always runs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # the exact commit the tests passed on - checked out AND deployed,
      # so the two can never diverge
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # SECURITY GATE (2026-08-20, Steve's requirement): nothing deploys
      # without passing the static tripwire - see tools/securityCheck.R
      # and AGENTS.md "Security". It needs Rscript, so it runs right
      # after setup-r and before anything heavier.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'     # matches renv.lock
          use-public-rspm: true

      - name: Security check (gate - deploy stops here on failure)
        run: Rscript tools/securityCheck.R

      # renv (2026-08-20): the runner's library is restored from
      # renv.lock, so the versions rsconnect records in the manifest -
      # and shinyapps.io then installs - are the locked ones. The
      # deploy TOOLS (rsconnect, remotes) float; they are couriers,
      # not cargo.
      - name: System libraries (ubuntu)
        # setup-r-dependencies used to install these automatically from
        # SystemRequirements via pak; setup-renv does not, and RSPM
        # binaries install fine but fail to LOAD without them (found:
        # pdftools "required" errors = libpoppler-cpp missing).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libpoppler-cpp-dev libcurl4-openssl-dev libssl-dev             libxml2-dev libfontconfig1-dev libfreetype6-dev             libharfbuzz-dev libfribidi-dev libpng-dev libjpeg-dev             libtiff5-dev libcairo2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Rebuild Rfast from source (RSPM binary/TBB ABI mismatch)
        # The prebuilt Linux Rfast binary fails to load - undefined TBB
        # symbol against the restored RcppParallel. A source build links
        # RcppParallel's own TBB correctly. renv caches the result, so
        # this compiles once per lockfile, not once per run.
        run: |
          Rscript -e 'options(pkgType = "source");
                      renv::install("Rfast@2.1.5.2", rebuild = TRUE, prompt = FALSE)'


      - name: Deploy tooling (floating)
        run: Rscript -e 'install.packages(c("rsconnect", "remotes"))'

      - name: Install the pushed commit from GitHub and deploy
        env:
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
          SHINY_ACCOUNT: ${{ vars.SHINY_ACCOUNT }}
          SHINY_APP_NAME: ${{ vars.SHINY_APP_NAME }}
        run: |
          Rscript -e '
            # First deploys from a fresh runner manifest force shinyapps to
            # build a new package image, which can exceed rsconnect'"'"'s
            # default per-request timeout while the client polls the build
            options(rsconnect.http.timeout = 900)
            remotes::install_github("StevenLShafer/IntegrityAnalysis",
                                    ref = Sys.getenv("DEPLOY_SHA"),
                                    upgrade = "never", force = TRUE)
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINY_ACCOUNT"),
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET"))
            # renv gotcha (2026-08-21, first lockfile deploy): rsconnect
            # sees renv.lock in appDir and switches to lockfile-based
            # dependency capture (parseRenvDependencies), which errored
            # AND would lose the GitHub-source record for this package.
            # Stage the one-file app in a clean directory: rsconnect
            # then captures dependencies from the RESTORED LIBRARY -
            # which holds exactly the locked versions - and records the
            # installed package'"'"'s GitHub provenance as always.
            stage <- file.path(tempdir(), "deploy-stage")
            dir.create(stage)
            file.copy("app.R", stage)
            rsconnect::deployApp(
              appDir = stage,
              appName = Sys.getenv("SHINY_APP_NAME"),
              appFiles = "app.R",
              account = Sys.getenv("SHINY_ACCOUNT"),
              server = "shinyapps.io",
              forceUpdate = TRUE, launch.browser = FALSE)
            cat("production deployed at", Sys.getenv("DEPLOY_SHA"), "\n")'
